services:
  # Posgres container config for dev
  dukatiq-test-postgres:
    image: postgres:17
    container_name: dukatiq-test-postgres-db
    restart: "no"
    env_file:
      - .env.test
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - dukatiq_test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Redis container config for dev
  dukatiq-test-redis:
    image: redis:7.2
    container_name: dukatiq-test-redis
    restart: "no"
    env_file:
      - .env.test
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - dukatiq_test_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
volumes:
  dukatiq_test_postgres_data:
  dukatiq_test_redis_data: