name: Server Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: server

    env:
      NODE_ENV: test
      COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      B2_REGION: ${{ secrets.B2_REGION }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_DEFAULT_FOLDER: ${{ secrets.B2_DEFAULT_FOLDER }}
      B2_SIGNED_URL_EXPIRES: ${{ secrets.B2_SIGNED_URL_EXPIRES }}
      DB_PATH: ":memory:"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22  
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci   # ✅ deterministic install (better than npm install)

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: server/coverage
      - name: Prepare coverage for GitHub Pages
        run: |
          mkdir -p public
          cp -r coverage/* public/
      - name: Deploy coverage to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./server/public
          
      - name: Comment coverage link on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📊 Coverage Report is ready:\n\n👉 https://${context.repo.owner}.github.io/${context.repo.repo}/`
            })